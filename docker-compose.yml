# Local development stack: Directus (headless CMS + API) backed by PostgreSQL.
# Values fall back to development defaults so `docker compose up -d` works after
# a bare `git clone`. Copy .env.example to .env to override any of them.

services:
  postgres:
    image: postgres:16-alpine
    container_name: solar-shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-solar_shop}
      POSTGRES_USER: ${DB_USER:-solar_shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solar_shop_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solar_shop} -d ${DB_DATABASE:-solar_shop}"]
      interval: 5s
      timeout: 5s
      retries: 12

  directus:
    image: directus/directus:11
    container_name: solar-shop-directus
    restart: unless-stopped
    ports:
      - "${DIRECTUS_PORT:-8055}:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:-dev-only-secret-replace-in-production}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-solar_shop}
      DB_USER: ${DB_USER:-solar_shop}
      DB_PASSWORD: ${DB_PASSWORD:-solar_shop_dev}

      # First-run bootstrap only; ignored once the admin user exists.
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin123}

      CORS_ENABLED: "true"
      CORS_ORIGIN: ${DIRECTUS_CORS_ORIGIN:-http://localhost:3000}

      # The storefront reads the catalogue anonymously; caching is handled by
      # Next.js ISR, so Directus only needs a short internal cache.
      CACHE_ENABLED: "true"
      CACHE_STORE: memory
      CACHE_TTL: 1m

      # Product images live on an external CDN (image_url field), so uploads are
      # only used for generated proforma PDFs and editorial assets.
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes:
      # A named volume, not a bind mount: the container runs as uid 1000 while a
      # host directory is owned by the developer's uid, and Directus writes a
      # probe file here on every health check.
      - directus_uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
      # Read-only, and mounted as a directory rather than a single file so the
      # stack starts before snapshot.yaml exists. `schema apply` reads from
      # here; `schema snapshot` writes to the host's stdout instead, which
      # sidesteps the uid mismatch entirely.
      - ./directus:/directus/schema:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8055/server/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  directus_uploads:
